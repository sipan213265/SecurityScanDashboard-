version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: securityscan_postgres
    environment:
      POSTGRES_DB: securityscandb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - securityscan_network
    command: 
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Nuclei DAST Scanner
  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: securityscan_nuclei
    entrypoint: ["sleep", "infinity"]
    volumes:
      - nuclei_templates:/root/nuclei-templates
      - ./SecurityScanDashboard/temp:/output
    networks:
      - securityscan_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  # Semgrep
  semgrep:
    image: semgrep/semgrep:latest
    container_name: securityscan_semgrep
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./SecurityScanDashboard/temp:/src
    networks:
      - securityscan_network

networks:
  securityscan_network:
    driver: bridge

volumes:
  postgres_data:
  nuclei_templates:
